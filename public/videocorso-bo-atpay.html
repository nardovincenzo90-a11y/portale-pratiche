:root{color-scheme:dark;font:17px system-ui;background:#0a1220;color:#e8f1ff}*{box-sizing:border-box}body{margin:0}header,footer{display:flex;align-items:center;gap:12px;padding:14px clamp(14px,4vw,60px);border-bottom:1px solid #293b55;background:#101c2e}header b{margin-right:auto}button,a{font:inherit;color:inherit;background:#253c5d;border:0;border-radius:8px;padding:9px 14px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#356095}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #6fe2d5}main{max-width:1180px;margin:auto;padding:clamp(18px,4vw,56px)}small{color:#77e3d3;letter-spacing:.11em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,4.5rem);letter-spacing:-.04em;line-height:1.05;margin:13px 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:18px;border:1px solid #31476a;border-radius:12px;background:#172640;font-size:clamp(1rem,2.2vw,1.5rem)}details{margin:22px 0;color:#d1ddf0;line-height:1.6}progress{width:100%;accent-color:#72e5d6}footer{flex-wrap:wrap;border-top:1px solid #293b55;position:sticky;bottom:0}footer span{margin-right:auto}.live{color:#ffd196}nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}nav button{font-size:.8rem}[aria-current=true]{background:#34786f}.capture nav,.capture details,.capture .hide-capture{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style><header><b>PORTALE PRATICHE · BO ATPAY</b><a href="/manuale-bo-atpay.pdf" target="_blank" rel="noopener">Manuale PDF</a><button id="full">Schermo intero</button></header><main><progress id="progress"></progress><p><small id="topic"></small></p><h1 id="title"></h1><div class="grid" id="cards"></div><details><summary>Copione da leggere</summary><p id="notes"></p></details><nav id="chapters" aria-label="Capitoli"></nav></main><footer><span id="status" aria-live="polite"></span><button id="prev">← Indietro</button><button id="next">Avanti →</button><button class="hide-capture" id="capture">Vista pulita</button><button class="hide-capture" id="record" hidden>Registra schermo</button><button id="stop" hidden>Termina e scarica</button></footer><script>
const S=[["Benvenuti","Dalla richiesta ASO all’esito","Inserimento|Recuperi VO|Presa in carico BO|Esito e controllo","Seguiamo una singola pratica. Ogni operatore può vedere a che punto è il lavoro e intervenire quando gli compete. La pratica di esempio e tutti i dati di questo corso sono fittizi."],["Accesso","Una casella per entrare, una per ricevere i link","Email aziendale · @konecta.com|Email alternativa · Attivazione e recupero|Password dimenticata · Inserisci l’email Konecta","L’operatore accede con la sua email Konecta e la password del portale. L’attivazione, quando l’abbinamento è verificato, e il recupero arrivano alla seconda casella. In caso di password dimenticata, il portale spiega che il link viene inviato all’indirizzo alternativo associato. L’admin decide le richieste di accesso BO presentate dopo l’iscrizione."],["I cinque ruoli","Chi vede e chi gestisce","Inserimento ASO · Le proprie richieste|BO ATPAY · Coda, Reclami e Tecnica|Recuperi · VO e Reclami|Admin · Controllo operativo|Super Admin · Accesso completo riservato","Inserimento ASO vede i propri inserimenti e i relativi esiti. BO ATPAY lavora la coda, i reclami e le segnalazioni tecniche. Recuperi lavora i VO e i reclami. Gli amministratori controllano le pratiche, le statistiche e gli accessi. Super Admin è riservato. Recuperi può anche essere abilitato come permesso aggiuntivo."],["Inserimento ASO","Una nuova pratica entra nella coda","Pratica dimostrativa #1042|Origine · ASO187 o ASO191|Cliente, recapito e note|Numero VO · Facoltativo","L’operatore sceglie l’origine, inserisce cliente e recapito, aggiunge le note e salva. Se il numero VO è già disponibile può inserirlo subito. L’operatore ritrova la pratica e il suo esito in I miei inserimenti, anche filtrando per giorno. La panoramica mostra anche la coda e la stima di attesa."],["Recuperi","Aggiungere il VO alla stessa pratica","Filtro · Senza VO|Scegli una pratica disponibile|Registra solo VO · 001234|Posizione nella coda BO invariata","Il supporto Recuperi vede le pratiche e i loro stati. Può scegliere un caso disponibile fuori ordine. Salvando solo il numero VO, la pratica mantiene il suo posto nella coda. Se il BO la prende nel frattempo, il supporto già assegnato può ancora aggiungere il VO. Finché la pratica è disponibile, può anche differirla o chiuderla con un esito."],["BO ATPAY","Dalla coda all’esito","Prendi la prima pratica disponibile|Controlla VO e note|Salva esito · FK15, FK30 o FK03|Differita · VO e richiamo futuro","Il BO prende la pratica più vecchia disponibile. Se ne ha già una in lavorazione, prosegue quella. Controlla le informazioni, aggiorna le note e registra l’esito. FK15, FK30 e FK03 rientrano nei fatturati. Per differire, serve il numero VO e un richiamo futuro tra le otto e le ventidue, ora italiana. Le code aperte includono gli arretrati."],["Reclami","Gestione condivisa da BO ATPAY e Recuperi","Scegli · Prendi in carico|Aggiungi note|Gestito · Torna disponibile|Chiusa · Rimozione con traccia nel registro","Sia BO ATPAY sia Recuperi possono prendere in carico i reclami. Il testo originale rimane distinto dalle note dell’operatore. Gestito rende il reclamo disponibile per essere ripreso. Chiusa lo rimuove dalla lista e l’operazione resta nel registro. Gli amministratori possono anche caricare più reclami insieme."],["Segnalazioni tecniche","Un FK15 può avere una richiesta tecnica","Esito BO · FK15|Richiedi apertura tecnica|Bozza, rilascio o completamento|Numero della segnalazione obbligatorio per completare","La richiesta tecnica si può aggiungere quando si salva l’esito o in seguito. Il FK15 e la data originaria rimangono in fatturazione. Nel bacino tecnico, BO e amministratori prendono in carico, salvano una bozza, rilasciano o registrano il numero della segnalazione per completare. Gli admin possono riaprire una segnalazione gestita."],["BOOM","Vista giornaliera per amministratori","Giorno di inserimento · Oggi o storico|Filtra per stato, tipo e testo|Esporta CSV|Elimina singole o selezionate con conferma","In BOOM l’admin può consultare pratiche e reclami per data. Ricerca e filtri delimitano anche il CSV. Si può eliminare un elemento singolo o una selezione, dopo conferma. Le eliminazioni sono registrate."],["Utenti e risorse","Accessi, strumenti e registro","Utenti e permessi · Ruoli e richieste BO|Statistiche · Personali e globali secondo il ruolo|TEAM SOSPC · Manuali · Documenti VO · Link|Comunicazioni · Appunti · Calendario","L’admin approva le richieste BO e gestisce i ruoli e l’abilitazione Recuperi. Il Super Admin rimane riservato. Il registro consente di ricostruire gli interventi. Il portale offre anagrafica TEAM SOSPC, manuali, documenti VO, link e comunicazioni. Gli appunti sono personali e il calendario viene conservato nel browser."],["Obiettivo del pilota","+10% di pratiche fatturate","Esempio · 100 → 110|Conteggio · FK15 + FK30 + FK03|Confronto · Periodi e volumi comparabili|Controllo · Fatturati per ora e sul totale lavorato","Puntiamo a un aumento del dieci per cento delle pratiche fatturate. Se la base è cento, il traguardo è centodieci. Per verificarlo confrontiamo prima e dopo su periodi comparabili, considerando i volumi e le ore lavorate. Misuriamo anche i fatturati per ora e la percentuale sul totale lavorato. È l’obiettivo del pilota, da verificare con i dati."]];const $=id=>document.getElementById(id);let i=0, recorder, stream, chunks=[];let recording=false;
S.forEach((s,n)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>draw(n);$('chapters').append(b)});
function draw(n){i=Math.max(0,Math.min(S.length-1,n));const [topic,title,items,notes]=S[i];$('progress').max=S.length;$('progress').value=i+1;$('topic').textContent=topic+' · Esempio illustrativo';$('title').textContent=title;$('notes').textContent=notes;$('cards').replaceChildren(...items.split('|').map(item=>{const c=document.createElement('div');c.className='card';c.textContent=item;return c}));$('prev').disabled=i===0;$('next').disabled=i===S.length-1;[...$('chapters').children].forEach((b,n)=>b.setAttribute('aria-current',n===i));if(!recording)$('status').textContent='Capitolo '+(i+1)+' di '+S.length;}
draw(0);$('prev').onclick=()=>draw(i-1);$('next').onclick=()=>draw(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')draw(i+1);if(e.key==='ArrowLeft')draw(i-1)});$('capture').onclick=()=>{document.body.classList.add('capture');$('status').textContent='Premi V per uscire dalla vista pulita';};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='v'&&!recording){document.body.classList.remove('capture');draw(i)}});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};$('record').hidden=!(navigator.mediaDevices?.getDisplayMedia&&window.MediaRecorder);
$('record').onclick=async()=>{let mic;try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});if(confirm('Includere la tua voce dal microfono?')){try{mic=await navigator.mediaDevices.getUserMedia({audio:true});for(const audio of mic.getAudioTracks())stream.addTrack(audio)}catch{$('status').textContent='Microfono non disponibile. Registrazione senza voce.';}} chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const u=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));const a=document.createElement('a');a.href=u;a.download='Videocorso-BO-ATPAY.'+(recorder.mimeType.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);recording=false;document.body.classList.remove('capture');$('stop').hidden=true;$('status').textContent='Registrazione scaricata.';};stream.getVideoTracks()[0].onended=()=>{if(recorder.state==='recording')recorder.stop()};recorder.start(1000);recording=true;document.body.classList.add('capture');$('status').textContent='● Registrazione in corso';$('stop').hidden=false;}catch{stream?.getTracks().forEach(t=>t.stop());mic?.getTracks().forEach(t=>t.stop());$('status').textContent='Registrazione non avviata. Puoi usare il registratore del computer.';}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
</script></html>
